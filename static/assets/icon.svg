<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ig-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdf497" />
      <stop offset="5%" stop-color="#fdf497" />
      <stop offset="45%" stop-color="#fd5949" />
      <stop offset="60%" stop-color="#d6249f" />
      <stop offset="90%" stop-color="#285AEB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#ig-grad)" />
  <!-- Inner Dark Glass Card -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="#0d0e15" fill-opacity="0.88" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  <!-- Instagram Camera & Play Reel -->
  <rect x="116" y="116" width="280" height="280" rx="72" fill="none" stroke="url(#ig-grad)" stroke-width="24" />
  <circle cx="256" cy="256" r="68" fill="none" stroke="url(#ig-grad)" stroke-width="24" />
  <circle cx="336" cy="176" r="14" fill="#ffffff" />
  <!-- Downloader Arrow Badge -->
  <circle cx="370" cy="370" r="76" fill="#0d0e15" stroke="url(#ig-grad)" stroke-width="8" filter="url(#glow)" />
  <path d="M370 326 v60 M342 358 l28 28 28-28" fill="none" stroke="#00f2fe" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
</svg>
